<script>
const $=s=>document.querySelector(s); const KEY='mahjong-html-v1';
const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const fmt=v=>(v>0?'+':'')+v; const yen=v=>(v>0?'+':v<0?'−':'')+'¥'+Math.abs(v).toLocaleString('ja-JP');
let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let state={mode:saved.mode||4,players:saved.players||['Aさん','Bさん','Cさん','Dさん'],rate:saved.rate??50,chipRate:saved.chipRate??100,gameFee:saved.gameFee??0,sessions:saved.sessions||[],rows:[newRow(saved.mode||4)],chips:Array(saved.mode||4).fill(''),editingId:null};
const localDateValue=(value=new Date())=>{const d=new Date(value);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
state.playedDate=localDateValue();
const playedAtIso=(dateText)=>{const [y,m,d]=String(dateText||localDateValue()).split('-').map(Number);return new Date(y,m-1,d,12,0,0).toISOString()};
function newRow(c){return{id:uid(),scores:Array(c).fill('')}}
function persist(){localStorage.setItem(KEY,JSON.stringify({mode:state.mode,players:state.players,rate:state.rate,chipRate:state.chipRate,gameFee:state.gameFee,sessions:state.sessions}))}
function balance(arr){const a=arr.slice(0,state.mode),missing=[];a.forEach((v,i)=>{if(v==='')missing.push(i)});const auto=missing.length===1?missing[0]:null;const values=a.map(n);if(auto!==null)values[auto]=-a.reduce((s,v,i)=>i===auto?s:s+n(v),0);return{values,auto,entered:a.filter(v=>v!=='').length}}
function playerNames(){const s=new Set(state.players.filter(Boolean));state.sessions.forEach(x=>(x.players||[]).forEach(v=>v&&s.add(v)));return [...s].sort((a,b)=>a.localeCompare(b,'ja'))}
function calc(){const rows=state.rows.map(r=>({...r,...balance(r.scores)}));const totals=Array.from({length:state.mode},(_,i)=>rows.reduce((s,r)=>s+r.values[i],0));const chip=balance(state.chips);const totalFee=Math.max(0,Math.trunc(n(state.gameFee)));const topIndex=totals.indexOf(Math.max(...totals));const roundedShare=Math.floor((totalFee/state.mode)/100)*100;const fees=Array(state.mode).fill(roundedShare);fees[topIndex]=totalFee-roundedShare*(state.mode-1);const payments=totals.map((v,i)=>v*n(state.rate)+chip.values[i]*n(state.chipRate)-fees[i]);const base=Math.floor(totalFee/state.mode);const rem=totalFee%state.mode;return{rows,totals,chip,totalFee,base,rem,fees,payments,topIndex,roundedShare}}
function syncInputs(){state.mode=n($('#mode').value);state.rate=$('#rate').value;state.chipRate=$('#chipRate').value;state.gameFee=$('#gameFee').value;persist()}
function render(){const c=calc();document.documentElement.style.setProperty('--player-count',state.mode);const note=$('#editNote');note.className='edit-note'+(state.editingId?' show':'');note.textContent=state.editingId?'確定済み対局を編集中です。保存すると通算成績も再計算されます。':'';$('#settle').textContent=state.editingId?'編集を完了':'今回の対局を確定';$('#mode').value=state.mode;$('#rate').value=state.rate;$('#chipRate').value=state.chipRate;$('#gameFee').value=state.gameFee;$('#playedDate').value=state.playedDate||localDateValue();$('#feeNote').textContent=`ゲーム代の端数はトップが負担`;
 const names=playerNames(),p=$('#players');p.className='grid '+(state.mode===4?'g4':'g3');p.innerHTML='';
 for(let i=0;i<state.mode;i++){const box=document.createElement('div');box.className='player-box';const used=state.players.slice(0,state.mode).filter((_,j)=>j!==i);const options=names.filter(x=>!used.includes(x));const currentExists=options.includes(state.players[i]);box.innerHTML=`<label>プレイヤー ${i+1}</label><select><option value="">名前を選択</option>${options.map(x=>`<option ${x===state.players[i]?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new__">＋新規プレイヤー</option></select><div class="player-new" ${currentExists?'hidden':''}><input placeholder="新しい名前" value="${currentExists?'':esc(state.players[i]||'')}"><button type="button" class="mini-btn">決定</button></div>`;const sel=box.querySelector('select'),newBox=box.querySelector('.player-new'),inp=box.querySelector('input'),ok=box.querySelector('button');sel.onchange=()=>{if(sel.value==='__new__'){newBox.hidden=false;inp.focus()}else if(sel.value){state.players[i]=sel.value;persist();render()}};const commit=()=>{const v=inp.value.trim();if(v){state.players[i]=v;persist();render()}};ok.onclick=commit;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit()}};p.appendChild(box)}
 renderScoresOnly();renderRecords();renderHistory();}
function applyValueColor(input){
  if(!input)return;
  input.classList.remove('value-positive','value-negative','value-zero');
  const raw=String(input.value??'').trim();
  if(raw===''){input.classList.add('value-zero');return;}
  const value=Number(raw);
  input.classList.add(value>0?'value-positive':value<0?'value-negative':'value-zero');
}
function renderScoresOnly(){const c=calc(),names=state.players.slice(0,state.mode);$('#scoreHead').innerHTML=`<tr><th>成績</th>${names.map(x=>`<th>${esc(x)}</th>`).join('')}<th></th></tr>`;$('#scoreBody').innerHTML='';c.rows.forEach((r,ri)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>#${ri+1}</td>`+names.map((_,i)=>`<td>${r.auto===i?`<div class="auto ${r.values[i]>=0?'positive':'negative'}"><small>自動</small>${fmt(r.values[i])}</div>`:`<input type="number" inputmode="decimal" enterkeyhint="next" data-row="${ri}" data-i="${i}" value="${esc(state.rows[ri].scores[i]||'')}" placeholder="0">`}</td>`).join('')+`<td><button class="btn danger" data-del="${ri}" ${state.rows.length===1?'disabled':''}>削除</button></td>`;$('#scoreBody').appendChild(tr)});const scoreInputs=[...$('#scoreBody').querySelectorAll('input')];scoreInputs.forEach((el,idx)=>{applyValueColor(el);el.oninput=()=>{const rowIndex=+el.dataset.row;state.rows[rowIndex].scores[+el.dataset.i]=el.value;applyValueColor(el);const missing=state.rows[rowIndex].scores.slice(0,state.mode).filter(v=>v==='').length;if(el.value===''||missing===1){renderScoresOnly()}};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();state.rows[+el.dataset.row].scores[+el.dataset.i]=el.value;const next=scoreInputs[idx+1];if(next)next.focus();else el.blur()}};el.onblur=()=>setTimeout(()=>{if(!document.activeElement?.matches('#scoreBody input'))renderScoresOnly()},0)});$('#scoreBody').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{state.rows.splice(+el.dataset.del,1);renderScoresOnly()});$('#scoreFoot').innerHTML=`<tr><td><b>点数計</b></td>${c.totals.map(v=>`<td class="${v>=0?'positive':'negative'}"><b>${fmt(v)}</b></td>`).join('')}<td></td></tr>`;
 const s=$('#settlements');
 s.className='';
 const subtotal=c.totals.map((score,i)=>score*n(state.rate)+c.chip.values[i]*n(state.chipRate));
 s.innerHTML=`<div class="settlement-table-wrap"><table class="settlement-table"><thead><tr><th class="row-label">集計</th>${names.map(name=>`<th>${esc(name)}</th>`).join('')}</tr></thead><tbody><tr><td class="row-label">点数合計</td>${c.totals.map(v=>`<td><span class="score-value ${v>=0?'positive':'negative'}">${fmt(v)}</span></td>`).join('')}</tr><tr><td class="row-label">チップ合計</td>${names.map((_,i)=>`<td>${c.chip.auto===i?`<span class="score-value ${c.chip.values[i]>=0?'positive':'negative'}">${fmt(c.chip.values[i])}</span>`:`<input type="number" inputmode="decimal" enterkeyhint="next" data-chip="${i}" value="${esc(state.chips[i]||'')}" placeholder="0">`}<span class="unit">枚</span></td>`).join('')}</tr><tr><td class="row-label">収支（小計）</td>${subtotal.map(v=>`<td><span class="money-value ${v>=0?'positive':'negative'}">${v}</span><span class="unit">P</span></td>`).join('')}</tr><tr class="final-row"><td class="row-label">収支</td>${c.payments.map((v,i)=>`<td><span class="money-value ${v>=0?'positive':'negative'}">${v}</span><span class="unit">P</span><span class="unit">ゲーム代 ${c.fees[i]}円</span></td>`).join('')}</tr></tbody></table></div>`;
 const chipInputs=[...s.querySelectorAll('input[data-chip]')];
 chipInputs.forEach((inp,index)=>{applyValueColor(inp);inp.oninput=()=>{state.chips[Number(inp.dataset.chip)]=inp.value;applyValueColor(inp);const missing=state.chips.slice(0,state.mode).filter(v=>v==='').length;if(inp.value===''||missing===1){renderScoresOnly()}};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();state.chips[Number(inp.dataset.chip)]=inp.value;if(chipInputs[index+1])chipInputs[index+1].focus();else inp.blur()}};inp.onblur=()=>setTimeout(()=>{if(!document.activeElement?.matches('#settlements input'))renderScoresOnly()},0)});
}
function records(){const m=new Map();state.sessions.forEach(x=>{const max=Math.max(...(x.scoreTotals||[0]));(x.players||[]).forEach((name,i)=>{const r=m.get(name)||{name,sessions:0,rounds:0,tops:0,score:0,chips:0,fee:0,payment:0,best:null,last:null};const pay=x.payments?.[i]||0;r.sessions++;r.rounds+=x.rows?.length||0;r.tops+=(x.scoreTotals?.[i]===max?1:0);r.score+=x.scoreTotals?.[i]||0;r.chips+=x.chips?.[i]||0;r.fee+=x.feeShares?.[i]||0;r.payment+=pay;r.best=r.best===null?pay:Math.max(r.best,pay);r.last=!r.last||x.createdAt>r.last?x.createdAt:r.last;m.set(name,r)})});return [...m.values()].sort((a,b)=>b.payment-a.payment)}
function renderRecords(){const rs=records();$('#records').innerHTML=rs.length?`<table><thead><tr><th>順位</th><th>名前</th><th>セット</th><th>半荘</th><th>トップ</th><th>累計点</th><th>チップ</th><th>ゲーム代</th><th>通算収支</th><th>最高収支</th><th>最終対局</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.sessions}</td><td>${r.rounds}</td><td>${r.tops}</td><td>${fmt(r.score)}</td><td>${fmt(r.chips)}</td><td>${yen(r.fee)}</td><td class="${r.payment>=0?'positive':'negative'}"><b>${yen(r.payment)}</b></td><td>${yen(r.best||0)}</td><td>${new Date(r.last).toLocaleDateString('ja-JP')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">確定した対局から通算成績を集計します</div>'}
function startEdit(id){const x=state.sessions.find(v=>v.id===id);if(!x)return;state.editingId=id;state.mode=x.mode;state.players=[...(x.players||[])];while(state.players.length<4)state.players.push('');state.rate=x.rate??state.rate;state.chipRate=x.chipRate??state.chipRate;state.gameFee=x.gameFee??0;state.playedDate=localDateValue(x.createdAt);state.rows=(x.rows||[]).map(values=>{const scores=values.map(String);scores[state.mode-1]='';return{id:uid(),scores}});if(!state.rows.length)state.rows=[newRow(state.mode)];state.chips=(x.chips||Array(state.mode).fill(0)).map(String);state.chips[state.mode-1]='';render();document.getElementById('currentMatch').scrollIntoView({behavior:'smooth',block:'start'})}

  historyElement.innerHTML=list.length?list.map(x=>{
    const players=(x.players||[]).map((name,i)=>{const st=sessionPlayerStats(x,i);return `<div class="history-player-row"><div><div class="history-player-name">${esc(name)}</div><div class="history-ranks"><span>1着${st.ranks[0]}回 / 2着${st.ranks[1]}回</span><br><span>3着${st.ranks[2]}回 / 4着${st.ranks[3]}回</span></div></div><div class="history-stat"><span class="history-panel-label">平均</span><strong>${st.avg.toFixed(2)}</strong></div><div class="history-payment ${x.payments[i]>=0?'positive':'negative'}">${yen(x.payments[i])}</div></div>`}).join('');
    return `<article class="history-card" data-session="${x.id}"><div class="history-card-head"><div><div class="history-date">${historyDateLabel(x.createdAt)}</div><div class="history-mode">${x.mode}人麻雀セット</div></div><div class="history-actions admin-only"><button class="btn" data-edit="${x.id}">✎ 編集</button><button class="btn danger" data-id="${x.id}">削除</button></div></div><div class="history-card-grid"><div class="history-main"><div class="history-panel"><span class="history-panel-label">参加者</span><div class="history-participants">${(x.players||[]).map(esc).join('、')}</div></div><div class="history-player-list">${players}</div></div><div class="history-side"><div class="history-panel history-stat"><span class="history-panel-label">対局数</span><strong>${x.rows?.length||0}</strong><span>回</span></div><div class="history-panel history-compact"><span class="history-panel-label">設定</span>点 ${x.rate}<br>チップ ${x.chipRate}<br>ゲーム代<br>${yen(x.gameFee||0)}</div></div></div></article>`;
  }).join(''):'<div class="empty">条件に一致する対局はありません</div>';
  historyElement.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
  historyElement.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!isRoomAdmin)return;if(confirm('この対局を削除しますか？')){const {error}=await sb.from('sessions').delete().eq('id',b.dataset.id).eq('room_id',cloudRoom.id);if(error)return cloudMessage(`削除エラー：${error.message}`,true);await loadCloudRoom()}});
};
render();
</script></body></html>
